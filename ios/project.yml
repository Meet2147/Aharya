name: Aharya
options:
  bundleIdPrefix: com.meetjethwa
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: C9NLF34677
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Aharya:
    type: application
    platform: iOS
    sources:
      - path: Aharya
    info:
      path: Aharya/Info.plist
      properties:
        CFBundleDisplayName: "Aharya"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBG
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        LSApplicationCategoryType: public.app-category.food-and-drink
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [whatsapp]
        UIAppFonts:
          - BricolageGrotesque_400Regular.ttf
          - BricolageGrotesque_600SemiBold.ttf
          - BricolageGrotesque_800ExtraBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meetjethwa.aharya
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
